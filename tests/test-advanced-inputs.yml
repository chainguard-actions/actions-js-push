name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          message: "test: advanced inputs commit"
          branch: main
          author_email: "test-bot@example.com"
          author_name: "Test Bot"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
          force: "false"
          tags: "false"
          directory: "."
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
