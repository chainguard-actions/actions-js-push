name: Test advanced push options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          message: "Test commit with advanced options"
          branch: master
          author_email: "github-actions[bot]@users.noreply.github.com"
          author_name: "github-actions[bot]"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
          force: "false"
          tags: "false"
          directory: "."
      - name: Assert action ran with all advanced inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with coauthor, empty, force, and tags inputs"
