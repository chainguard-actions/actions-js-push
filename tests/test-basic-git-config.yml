name: Test basic git config setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: test-actor
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to commit
        run: echo "hello world" > test-change.txt

      - id: action
        name: Run action (push will fail in test env, that is expected)
        uses: .
        continue-on-error: true
        with:
          github_token: 'fake-token-for-testing'
          author_email: 'test@example.com'
          author_name: 'Test User'
          message: 'test: basic git config'
          branch: main
          empty: 'true'

      - name: Assert git user.email was configured
        run: |
          EMAIL=$(git config --local user.email || echo "")
          echo "git user.email: $EMAIL"
          if [ "$EMAIL" != "test@example.com" ]; then
            echo "FAIL: expected git user.email to be 'test@example.com', got '$EMAIL'"
            exit 1
          fi
          echo "PASS: git user.email correctly set"

      - name: Assert git user.name was configured
        run: |
          NAME=$(git config --local user.name || echo "")
          echo "git user.name: $NAME"
          if [ "$NAME" != "Test User" ]; then
            echo "FAIL: expected git user.name to be 'Test User', got '$NAME'"
            exit 1
          fi
          echo "PASS: git user.name correctly set"
