name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file change
        run: |
          echo "test-$(date +%s)" > /tmp/test-change.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          message: "test: basic push commit message"
          branch: main
          author_email: test@example.com
          author_name: Test User
          directory: .
      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS"
