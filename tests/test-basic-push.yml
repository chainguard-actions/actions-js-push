name: Test basic push with message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to commit
        run: |
          echo "test content $(date)" > test-file.txt
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          message: "chore: test commit message"
          author_email: "test-author@example.com"
          author_name: "Test Author"
          branch: "main"
          directory: "."

      - name: Assert action ran (push may fail without real remote)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail when pushing to a fake remote,
          # but it should have run (not be skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected"
