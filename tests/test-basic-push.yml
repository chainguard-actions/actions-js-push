name: Test basic push inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test-$(date +%s)" > test-file.txt
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add test-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          message: "test: basic push commit"
          branch: main
          author_email: "github-actions[bot]@users.noreply.github.com"
          author_name: "github-actions[bot]"
          directory: "."
      - name: Assert action ran (push may fail in act but inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted all inputs without configuration error"
