name: Test basic push inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to commit
        run: |
          echo "test-$(date +%s)" > test-file.txt
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          message: "chore: test commit from act"
          author_email: "test@example.com"
          author_name: "Test Bot"
          branch: main
          directory: "."
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
