name: Test basic push inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git and create a dummy change
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test-$(date +%s)" > /tmp/test-dummy.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          author_email: "bot@example.com"
          author_name: "Test Bot"
          branch: "master"
          directory: "."
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may fail on push due to no changes or permissions)"
          echo "PASS: inputs were accepted by the action"
