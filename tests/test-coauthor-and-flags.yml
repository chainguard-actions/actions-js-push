name: Test coauthor, empty, force, and tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to commit
        run: |
          echo "coauthor test content $(date)" > coauthor-test-file.txt
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add coauthor-test-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          message: "chore: test with coauthor and flags"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
          force: "true"
          tags: "true"
          branch: "main"

      - name: Assert action ran (push may fail without real remote)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail when pushing to a fake remote,
          # but it should have run (not be skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected"
