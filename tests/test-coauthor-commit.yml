name: Test co-authored commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and set up local remote to intercept push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a test file to commit
          echo "coauthor-test-$(date +%s)" > tests/test-coauthor-artifact.txt

          # Create a bare repo to receive the push
          git init --bare /tmp/fake-remote.git
          git push /tmp/fake-remote.git HEAD:refs/heads/act-harness

          # Create a git wrapper that redirects push to local bare repo
          mkdir -p /tmp/git-wrapper
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = "push" ]; then' \
            '  shift' \
            '  newargs=""' \
            '  for arg in "$@"; do' \
            '    case "$arg" in' \
            '      https://*) newargs="$newargs /tmp/fake-remote.git" ;;' \
            '      *) newargs="$newargs $arg" ;;' \
            '    esac' \
            '  done' \
            '  eval exec /usr/bin/git push $newargs' \
            'fi' \
            'exec /usr/bin/git "$@"' > /tmp/git-wrapper/git
          chmod +x /tmp/git-wrapper/git
          echo "/tmp/git-wrapper" >> "$GITHUB_PATH"

      - id: action
        name: Run push action with co-author
        uses: .
        env:
          GITHUB_ACTOR: "test-actor"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: act-harness
          message: "test: co-authored commit from act test suite"
          author_email: "primary-author@example.com"
          author_name: "Primary Author"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"

      - name: Assert co-author trailer is present in commit
        run: |
          echo "Action completed without error"
          LAST_MSG=$(git log -1 --format="%B")
          echo "Last commit message body:"
          echo "$LAST_MSG"
          if echo "$LAST_MSG" | grep -q "Co-authored-by: Co Author <coauthor@example.com>"; then
            echo "PASS: co-author trailer found in commit"
          else
            echo "FAIL: expected 'Co-authored-by: Co Author <coauthor@example.com>' in commit body"
            exit 1
          fi
