name: Test coauthor, empty commit, and tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          message: "chore: test empty commit with coauthor"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
          tags: "true"
          branch: main
      - name: Assert action ran (push may fail in act environment)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with coauthor, empty, and tags inputs"
