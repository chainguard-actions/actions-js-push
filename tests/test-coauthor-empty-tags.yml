name: Test coauthor, empty commit, and tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          message: "test: coauthor and empty commit"
          branch: main
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
          tags: "true"
      - name: Assert action ran with coauthor, empty, and tags inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted coauthor_email, coauthor_name, empty, and tags inputs"
