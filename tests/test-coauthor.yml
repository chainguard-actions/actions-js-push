name: Test coauthor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup git and create a test commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "coauthor-test-$(date +%s)" > coauthor-test-file.txt
          git add coauthor-test-file.txt
          git commit -m "test: add file for coauthor push test" || echo "Nothing to commit"

      - name: Run action with coauthor inputs (expect push failure in act environment)
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          author_email: "test@example.com"
          author_name: "Test User"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          branch: "master"

      - name: Verify action was invoked with coauthor inputs
        run: |
          echo "Action completed with coauthor inputs (push may fail in act environment without real token)"
          echo "PASS: coauthor inputs were accepted"
