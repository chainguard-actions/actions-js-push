name: Test coauthor inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          author_email: "bot@example.com"
          author_name: "Test Bot"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          branch: "master"
          directory: "."
      - name: Assert coauthor inputs were accepted
        run: |
          echo "Action completed with coauthor inputs"
          echo "PASS: coauthor_email and coauthor_name inputs were accepted"
