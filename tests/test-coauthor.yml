name: Test coauthor commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file to commit
        run: |
          echo "coauthor-test-$(date +%s)" > coauthor-test-file.txt
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          message: "test: coauthor commit"
          branch: main
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          empty: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step with coauthor inputs executed"
