name: Test committing a new file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: test-actor
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local bare remote so push succeeds
        run: |
          git config --global user.email "setup@test.com"
          git config --global user.name "Setup User"
          git init --bare /tmp/test-remote.git
          git remote add localremote /tmp/test-remote.git
          git push localremote HEAD:main

      - name: Create a new file to be committed
        run: |
          echo "hello from act test" > /tmp/act-test-file.txt
          cp /tmp/act-test-file.txt act-test-file.txt

      - name: Run action to commit and push the new file
        id: action
        uses: .
        with:
          github_token: 'fake-token-for-testing'
          author_email: 'bot@example.com'
          author_name: 'Test Bot'
          message: 'test: add act-test-file.txt'
          branch: 'main'
        continue-on-error: true

      - name: Verify the new file was committed
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "last commit message: $MSG"
          if [ "$MSG" != "test: add act-test-file.txt" ]; then
            echo "FAIL: expected commit message 'test: add act-test-file.txt', got '$MSG'"
            exit 1
          fi
          echo "PASS: new file was committed with correct message"

      - name: Verify the file is tracked in git
        run: |
          if ! git show HEAD:act-test-file.txt > /dev/null 2>&1; then
            echo "FAIL: act-test-file.txt not found in last commit"
            exit 1
          fi
          echo "PASS: act-test-file.txt is tracked in git"
