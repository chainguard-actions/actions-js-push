name: Test custom author configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: test-actor
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        with:
          github_token: fake-token-for-custom-author-test
          author_email: custom-author@example.com
          author_name: Custom Author
          branch: main
      - name: Assert action completed with custom author
        run: |
          echo "Action completed successfully with custom author configuration"
          echo "PASS"
