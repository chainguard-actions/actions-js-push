name: Test custom author and co-author
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install fake git that intercepts push
        run: |
          mkdir -p /tmp/fake-bin
          printf '#!/bin/sh\n' > /tmp/fake-bin/git
          printf 'for arg in "$@"; do\n' >> /tmp/fake-bin/git
          printf '  if [ "$arg" = "push" ]; then\n' >> /tmp/fake-bin/git
          printf '    echo "[fake-git] Intercepted push: git $*"\n' >> /tmp/fake-bin/git
          printf '    exit 0\n' >> /tmp/fake-bin/git
          printf '  fi\n' >> /tmp/fake-bin/git
          printf 'done\n' >> /tmp/fake-bin/git
          printf 'exec /usr/bin/git "$@"\n' >> /tmp/fake-bin/git
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
          echo "Fake git installed and added to PATH"

      - name: Configure git and create a test file to commit
        run: |
          git config user.email "custom-author@example.com"
          git config user.name "Custom Author"
          echo "coauthor-test-$(date +%s)" > tests/test-artifact-coauthor.txt
          git add tests/test-artifact-coauthor.txt

      - name: Push with custom author and co-author
        id: push
        uses: .
        with:
          github_token: ${{ github.token }}
          author_email: "custom-author@example.com"
          author_name: "Custom Author"
          coauthor_email: "coauthor@example.com"
          coauthor_name: "Co Author"
          message: "test: custom author and co-author from act test"
          branch: act-harness
          force: "true"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error with custom author and co-author"
