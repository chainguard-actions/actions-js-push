name: Test empty commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install fake git that intercepts push
        run: |
          mkdir -p /tmp/fake-bin
          printf '#!/bin/sh\n' > /tmp/fake-bin/git
          printf 'for arg in "$@"; do\n' >> /tmp/fake-bin/git
          printf '  if [ "$arg" = "push" ]; then\n' >> /tmp/fake-bin/git
          printf '    echo "[fake-git] Intercepted push: git $*"\n' >> /tmp/fake-bin/git
          printf '    exit 0\n' >> /tmp/fake-bin/git
          printf '  fi\n' >> /tmp/fake-bin/git
          printf 'done\n' >> /tmp/fake-bin/git
          printf 'exec /usr/bin/git "$@"\n' >> /tmp/fake-bin/git
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
          echo "Fake git installed and added to PATH"

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Push empty commit via action
        id: push
        uses: .
        with:
          github_token: ${{ github.token }}
          author_email: "test@example.com"
          author_name: "Test User"
          message: "test: empty commit from act test"
          branch: act-harness
          empty: "true"
          force: "true"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Assert empty commit push succeeded
        run: |
          echo "PASS: empty commit action completed without error"
