name: Test force, empty, and tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          message: "test: force empty tags commit"
          branch: master
          force: "true"
          empty: "true"
          tags: "true"
      - name: Assert action ran with force, empty, and tags inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with force, empty, and tags inputs"
