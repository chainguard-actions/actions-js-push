name: Test force push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and set up fake git to intercept push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a local bare repo to receive the push
          git init --bare /tmp/test-remote-forcepush.git
          git push /tmp/test-remote-forcepush.git HEAD:refs/heads/act-harness

          # Find the real git binary (before we shadow it)
          REAL_GIT="$(which git)"

          # Create a fake git wrapper that redirects github.com pushes to local repo
          mkdir -p /tmp/fake-git-forcepush
          {
            echo '#!/bin/sh'
            echo "REAL_GIT=\"$REAL_GIT\""
            echo 'if [ "$1" = "push" ]; then'
            echo '  shift'
            echo '  newargs=""'
            echo '  for arg in "$@"; do'
            echo '    case "$arg" in'
            echo '      https://*github.com*) arg="file:///tmp/test-remote-forcepush.git" ;;'
            echo '    esac'
            echo '    newargs="${newargs:+$newargs }$arg"'
            echo '  done'
            echo '  exec "$REAL_GIT" push $newargs'
            echo 'fi'
            echo 'exec "$REAL_GIT" "$@"'
          } > /tmp/fake-git-forcepush/git
          chmod +x /tmp/fake-git-forcepush/git
          # Verify the fake git works
          /tmp/fake-git-forcepush/git --version

      - name: Create a test file to commit
        run: |
          echo "force-push-test-$(date +%s)" > tests/test-force-temp.txt
          echo "Created test file for force push test"

      - name: Run action with force push enabled
        id: action
        uses: .
        env:
          GITHUB_ACTOR: x-access-token
          PATH: /tmp/fake-git-forcepush:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          github_token: ${{ github.token }}
          branch: act-harness
          author_email: test@example.com
          author_name: Test User
          force: 'true'

      - name: Assert action completed successfully with force push
        run: |
          echo "PASS: action completed with force push enabled"

      - name: Clean up temp file
        if: always()
        run: rm -f tests/test-force-temp.txt
