name: Test force push and rebase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git and stage a change
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "force-rebase-test-$(date +%s)" > force-rebase-test.txt
          git add force-rebase-test.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          message: "test: force push with rebase"
          branch: main
          force: "true"
          rebase: "true"
      - name: Assert action ran with force and rebase inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action accepted force and rebase inputs"
