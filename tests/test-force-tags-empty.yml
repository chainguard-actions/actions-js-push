name: Test force push with tags and empty commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with force, tags, and empty inputs (push may fail in act environment)
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          message: "test: force push with tags and empty"
          branch: main
          author_email: "test@example.com"
          author_name: "Test User"
          force: "true"
          tags: "true"
          empty: "true"

      - name: Verify action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with force, tags, and empty inputs"
