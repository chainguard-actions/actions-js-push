name: Test force push and tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file change to commit
        run: |
          echo "force-test-$(date +%s)" > force-test.txt
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add force-test.txt
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          message: "test: force push with tags"
          branch: main
          force: "true"
          tags: "true"
        continue-on-error: true
      - name: Assert action ran with force and tags inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped"
            exit 1
          fi
          echo "PASS: action was invoked with force and tags inputs"
