name: Test missing github_token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with empty github_token (expect failure)
        id: push
        uses: .
        with:
          github_token: ""
          message: "test: should fail due to missing token"
          branch: act-harness
          empty: "true"
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.push.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github_token is empty, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when github_token was empty"
