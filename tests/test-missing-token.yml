name: Test missing github_token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with empty token and expect failure
        id: action
        uses: .
        with:
          github_token: ''
          branch: act-harness
        continue-on-error: true

      - name: Assert action failed due to missing token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when github_token is empty"
            exit 1
          fi
          echo "PASS: action correctly failed with missing token"
