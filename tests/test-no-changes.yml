name: Test no changes to commit exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no file changes (nothing to commit)
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: act-harness
          message: 'test: should not commit anything'

      - name: Assert action succeeded gracefully with no changes
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed gracefully when there is nothing to commit"
            exit 1
          fi
          echo "PASS: action exited 0 with no changes to commit"
