name: Test push with tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git, create a tag, and set up local remote to intercept push
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a test file to commit
          echo "tags-test-$(date +%s)" > tests/test-tags-artifact.txt

          # Create a local tag to push
          git tag v0.0.99-act-test

          # Create a bare repo to receive the push
          git init --bare /tmp/fake-remote.git
          git push /tmp/fake-remote.git HEAD:refs/heads/act-harness

          # Create a git wrapper that redirects push to local bare repo
          mkdir -p /tmp/git-wrapper
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = "push" ]; then' \
            '  shift' \
            '  newargs=""' \
            '  for arg in "$@"; do' \
            '    case "$arg" in' \
            '      https://*) newargs="$newargs /tmp/fake-remote.git" ;;' \
            '      *) newargs="$newargs $arg" ;;' \
            '    esac' \
            '  done' \
            '  eval exec /usr/bin/git push $newargs' \
            'fi' \
            'exec /usr/bin/git "$@"' > /tmp/git-wrapper/git
          chmod +x /tmp/git-wrapper/git
          echo "/tmp/git-wrapper" >> "$GITHUB_PATH"

      - id: action
        name: Run push action with tags=true
        uses: .
        env:
          GITHUB_ACTOR: "test-actor"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: act-harness
          message: "test: push with tags from act test suite"
          author_email: "test@example.com"
          author_name: "Test User"
          tags: "true"
          empty: "true"

      - name: Assert action completed successfully and tag was pushed
        run: |
          echo "Action completed without error"
          # Verify the tag exists in the fake remote
          TAGS=$(git ls-remote /tmp/fake-remote.git --tags | grep "v0.0.99-act-test" || echo "")
          echo "Tags in remote: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: expected tag 'v0.0.99-act-test' to be pushed to remote"
            exit 1
          fi
          echo "PASS: tags push succeeded"
